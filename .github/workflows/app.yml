# Pipeline applicative : construire l'image, la scanner, la publier, la déployer sur Kubernetes (EKS).
#
#   Sur une Pull Request :  docker build -> Trivy image (bloquant) + Trivy manifestes Kubernetes (rapport)
#   Après merge dans main : docker build -> Trivy (bloquant) -> push ECR (tag = SHA du commit) -> kubectl apply -> vérifications
#
# Une image vulnérable ne peut donc jamais arriver dans le registre, ni a fortiori en production.

name: Application

on:
  pull_request:
    paths: ["app/**", "k8s/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "k8s/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: scp-app
  EKS_CLUSTER: scp-eks
  NAMESPACE: tasky

jobs:
  # Sur Pull Request : on vérifie seulement que l'image se construit et qu'elle est saine.
  # Pas d'accès AWS ici.
  scan:
    name: Build et scans (Pull Request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: docker build
        run: docker build -t app:${{ github.sha }} app

      # Trivy cherche les vulnérabilités connues (CVE) dans l'image.
      # exit-code 1 : le job échoue s'il trouve du CRITICAL ou HIGH qui a un correctif disponible.
      - name: Trivy (scan de vulnérabilités de l'image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Trivy lit aussi les manifestes Kubernetes. Il signale le binding cluster-admin imposé par l'exercice (KSV-0111) :
      # en rapport seulement (exit-code 0), pour montrer que la faiblesse est vue, sans bloquer l'exercice.
      - name: Trivy (manifestes Kubernetes, rapport non bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: k8s
          exit-code: "0"

  # Sur main : build, scan, push, déploiement.
  release:
    name: Build, scan, push et déploiement
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # jeton OIDC pour AWS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: docker build
        run: docker build -t app:${{ github.sha }} app

      - name: Trivy (scan de vulnérabilités de l'image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # On n'arrive ici que si Trivy est passé. Connexion avec le rôle de déploiement (branche main uniquement).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-scp-app-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Tag = SHA du commit : on sait toujours exactement quel code tourne en production.
      - name: Push de l'image dans ECR
        id: push
        run: |
          REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag app:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Connexion au cluster EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      # Les manifestes sont appliqués dans l'ordre des numéros (namespace, RBAC, IngressClass, Deployment...).
      # L'image est remplacée par celle qu'on vient de pousser.
      - name: Déploiement sur Kubernetes
        run: |
          kubectl apply -f k8s/00-namespace.yaml

          # Secret Kubernetes de l'application, alimenté depuis SSM Parameter Store (rien dans git, rien dans les logs).
          MONGODB_URI=$(aws ssm get-parameter --name /scp/app/mongodb-uri --with-decryption --query Parameter.Value --output text)
          JWT_SECRET=$(aws ssm get-parameter --name /scp/app/jwt-secret --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$MONGODB_URI"
          echo "::add-mask::$JWT_SECRET"
          kubectl create secret generic tasky-secrets -n "$NAMESPACE" \
            --from-literal=mongodb-uri="$MONGODB_URI" \
            --from-literal=jwt-secret="$JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

          mkdir -p rendered
          for f in k8s/*.yaml; do
            sed "s|IMAGE_PLACEHOLDER|${{ steps.push.outputs.image }}|" "$f" > "rendered/$(basename "$f")"
          done
          kubectl apply -f rendered/

          # Attend que les nouveaux pods soient prêts (sinon le job échoue).
          kubectl rollout status deployment/tasky -n "$NAMESPACE" --timeout=5m

      # Preuves visibles dans les logs de la pipeline (et rejouées en démo).
      - name: Vérifications
        run: |
          echo "Fichier wizexercise.txt dans le conteneur en cours d'exécution :"
          kubectl exec -n "$NAMESPACE" deploy/tasky -- cat /app/wizexercise.txt

          echo "Adresse publique de l'application (le load balancer peut mettre 2-3 minutes à répondre) :"
          for i in $(seq 1 30); do
            HOST=$(kubectl get ingress tasky -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$HOST" ] && break
            sleep 10
          done
          echo "http://$HOST"
