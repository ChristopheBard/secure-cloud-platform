# Exposition à Internet : Ingress Kubernetes + load balancer AWS (ALB) créé automatiquement par EKS Auto Mode.
# Internet -> ALB (subnets publics) -> pods (subnets privés)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasky
  namespace: tasky
  annotations:
    # L'ALB envoie le trafic directement aux IP des pods.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tasky
                port:
                  number: 80
